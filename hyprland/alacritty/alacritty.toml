# Alacritty config for the Hyprland laptop rice. Palette is documented in README.md.

[window]
opacity = 0.7 # Hyprland blurs what shows through
padding = { x = 10, y = 10 }

[font]
size = 10
# Bold and italic use the same family automatically
normal = { family = "Sometype Mono", style = "Regular" }

[colors.primary]
background = "#1d1e31"
foreground = "#72daea"

[colors.cursor]
text = "#1d1e31"
cursor = "#9d7cd8"

[colors.selection]
text = "#1d1e31"
background = "#9d7cd8"

# ANSI colors (Dracula)
[colors.normal]
black   = "#000000"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#bd93f9"
magenta = "#ff79c6"
cyan    = "#8be9fd"
white   = "#bfbfbf"

[colors.bright]
black   = "#4d4d4d"
red     = "#ff6e67"
green   = "#5af78e"
yellow  = "#f4f99d"
blue    = "#caa9fa"
magenta = "#ff92d0"
cyan    = "#9aedfe"
white   = "#e6e6e6"
