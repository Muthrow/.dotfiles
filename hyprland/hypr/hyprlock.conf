# Hyprlock lock screen for the laptop rice. Lives at ~/.config/hypr/hyprlock.conf
# Reference: https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/
# Palette is documented in README.md.

$font    = Sometype Mono
$display = Cinzel Decorative
$text    = rgba(d6d8f0ff)
$muted   = rgba(565a85ff)
$accent  = rgba(9d7cd8ff)
$cyan    = rgba(72daeaff)
$red     = rgba(ff5555ff)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Blurred, darkened snapshot of the desktop
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $display
    color = $text
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = $font
    color = $cyan
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(1d1e3199)
    outer_color = $accent $cyan 45deg
    check_color = $cyan
    fail_color = $red
    font_color = $text
    font_family = $font
    fade_on_empty = false
    rounding = 12
    placeholder_text = <i>Password</i>
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -60
    halign = center
    valign = center
}

# Who's logged in
label {
    monitor =
    text = $USER
    font_size = 14
    font_family = $font
    color = $muted
    position = 0, -130
    halign = center
    valign = center
}
