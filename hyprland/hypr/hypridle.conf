# Hypridle for the laptop rice. Lives at ~/.config/hypr/hypridle.conf
# Reference: https://wiki.hypr.land/hypr-ecosystem/user/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock                             # one lock screen at a time
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume
}

# 4 min: dim the screen and turn off the keyboard backlight
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}
listener {
    timeout = 240
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 min: screen off
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
