# Hyprpaper for the laptop rice. Lives at ~/.config/hypr/hyprpaper.conf
# Reference: https://wiki.hypr.land/hypr-ecosystem/user/hyprpaper/

splash = false

wallpaper {
    monitor =
    path = ~/Pictures/Wallpapers/morants-curve.jpg
    fit_mode = cover
}

# Or rotate through the whole folder: comment out the block above and use this one.
# wallpaper {
#     monitor =
#     path = ~/Pictures/Wallpapers
#     fit_mode = cover
#     timeout = 900
#     order = random
# }
