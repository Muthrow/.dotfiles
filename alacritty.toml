[window]
opacity = 0.7

[window.padding]
x = 10
y = 10

[window.class]
instance = "Alacritty"
general = "Alacritty"

[font]
size = 10

[font.normal]
family = "Sometype Mono"
style = "Regular"

[font.italic]
family = "Sometype Mono"
style = "Italic"

[font.bold]
family = "Sometype Mono"
style = "Bold"

[font.bold_italic]
family = "Sometype Mono"
style = "Bold Italic"



[colors.primary]
background = "#1d1e31"
foreground = "#72daea"

[colors.normal]
black   = "#000000"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#bd93f9"
magenta = "#ff79c6"
cyan    = "#8be9fd"
white   = "#bfbfbf"

[colors.bright]
black   = "#4d4d4d"
red     = "#ff6e67"
green   = "#5af78e"
yellow  = "#f4f99d"
blue    = "#caa9fa"
magenta = "#ff92d0"
cyan    = "#9aedfe"
white   = "#e6e6e6"
